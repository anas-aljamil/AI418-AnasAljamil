[project]
name = "mawjood-api"
version = "0.2.0"
description = "Mawjood office-hours availability API (FastAPI + MySQL 8.0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pymysql[rsa]>=1.1,<2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and demo passwords are expected in tests
